name: testes

on:
  push:
  pull_request:

jobs:
  testes-sinteticos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Executar controles sem dados protegidos
        run: Rscript --vanilla executar_testes.R
